name: nextcloud-aio
services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    init: true
    restart: always
    container_name: nextcloud-aio-mastercontainer
    network_mode: bridge
    ports:
      - "${AIO_BIND_IP:-127.0.0.1}:${AIO_PORT:-18080}:8080"
    environment:
      APACHE_PORT: "${APACHE_PORT:-11000}"
      APACHE_IP_BINDING: "${APACHE_IP_BINDING:-127.0.0.1}"
      SKIP_DOMAIN_VALIDATION: "${SKIP_DOMAIN_VALIDATION:-true}"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  # Backup storage is provisioned separately by scripts/backup.py.
  # It is intentionally outside the Compose lifecycle.
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
